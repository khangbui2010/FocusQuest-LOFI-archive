name: Build music catalog

# Mỗi khi có bài mới (docs/meta/*.json hoặc docs/tracks/*), gộp lại thành
# docs/tracks.json và docs/LICENSES.md, kiểm tra dữ liệu, rồi commit lại.
on:
  push:
    branches: [main]
    paths:
      - 'docs/meta/**'
      - 'docs/tracks/**'
      - 'scripts/build-catalog.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate and build catalog
        run: node scripts/build-catalog.mjs
      - name: Commit generated files
        run: |
          if [ -n "$(git status --porcelain docs/tracks.json docs/LICENSES.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/tracks.json docs/LICENSES.md
            git commit -m "chore: rebuild music catalog [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Catalog unchanged."
          fi
